services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CLIPPINGAI_DATA_DIR: /app/data
      MAX_UPLOAD_MB: "2048"
      ENABLE_TRANSCRIPTION: "false"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
